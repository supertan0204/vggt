defaults:
  - default_dataset.yaml


img_size: 518
num_workers: 8
seed_value: 42
accum_steps: 1
patch_size: 14

data:
  # train:
  #   _target_: training.datasets.DynamicDataset
  # val:
  #   _target_: training.datasets.DynamicDataset
    train:
      co3d: 
        _target_: training.data.datasets.co3d.Co3dDataset
        common_conf:
          seed: 42
          img_size: 518
          patch_size: 14
          aspects: [0.5, 1.0]
          img_nums: [2, 24]
          augs:
            scales: [0.8, 1.2]
          rescale: True
          rescale_aug: True
          landscape_check: True
          debug: True
          training: False
          get_nearby: False
          load_depth: False
          inside_random: True
        split: train
        CO3D_DIR: /home/ubuntu/nvme/xiyang/vggt/co3d
        CO3D_ANNOTATION_DIR: /home/ubuntu/nvme/xiyang/vggt/co3d
        min_num_images: 24
        len_train: 100000
        len_test: 10000
        

    val:
      co3d: 
        _target_: training.data.datasets.co3d.Co3dDataset
        common_conf:
          img_size: 518
          patch_size: 14
          augs:
            scales: [0.8, 1.2]
          rescale: True
          rescale_aug: True
          landscape_check: True
          debug: True
          training: False
          get_nearby: False
          load_depth: False
          inside_random: True
        split: val
        CO3D_DIR: /home/ubuntu/nvme/xiyang/vggt/co3d
        CO3D_ANNOTATION_DIR: /home/ubuntu/nvme/xiyang/vggt/co3d
        min_num_images: 24
        len_train: 100000
        len_test: 10000
     



logging:
  log_dir: logs
  log_level_primary: DEBUG
  log_level_secondary: WARNING
  all_ranks: False
  tensorboard_writer:
    _target_: training.train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard

checkpoint:
  save_dir: None
  save_freq: 10
  model_weight_initializer: None

device: cuda

optim:
  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-4
    weight_decay: 0.05

  frozen_module_names:
      - "aggregator"  # example, freeze the aggregator
      - "depth_head"
      - "camera_head"
      - "point_head"

  amp:
    enabled: True
    amp_dtype: bfloat16
  gradient_clip:
    _target_: training.train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: "aggregator"
        max_norm: 1.0   # feel free to reduce this if you see instabilities
        norm_type: 2
      - module_name: ["depth"]
        max_norm: 1.0   # feel free to reduce this if you see instabilities
        norm_type: 2
      - module_name: ["camera"]
        max_norm: 1.0   # feel free to reduce this if you see instabilities
        norm_type: 2
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: 1e-4
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 1e-4
              end_value: 1e-8
          lengths: [0.05, 0.95]
          interval_scaling: ['rescaled', 'rescaled']
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.05




max_epochs: 100

model:
  _target_: vggt.models.vggt_gs.VGGT_GS
  enable_camera: True
  enable_depth: True
  enable_point: False
  enable_track: False


distributed:
  # check https://docs.pytorch.org/docs/stable/generated/torch.nn.parallel.DistributedDataParallel.html for options
  backend: nccl
  comms_dtype: None
  find_unused_parameters: False
  timeout_mins: 30
  gradient_as_bucket_view: True  # Less memory used
  bucket_cap_mb: 25
  broadcast_buffers: True

cuda:
    cudnn_deterministic: False
    cudnn_benchmark: False
    allow_tf32: True

gs_mode: True

loss:
  