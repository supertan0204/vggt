defaults:
  - default_dataset.yaml

exp_name: exp-9.8
img_size: 518
num_workers: 8
seed_value: 42
accum_steps: 1 
patch_size: 14

limit_train_batches: 800
limit_val_batches: 400

data:
  # The code for data still looks too complicated. I should refactor this again (do I have time?...)
  train:
    _target_: training.data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    shuffle: True
    pin_memory: True
    max_img_per_gpu: 12
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: True # need to be False for actual training
      image_nums: [2, 12]
      repeat_batch: False

      augs:
        cojitter: True
        cojitter_ratio: 0.3
        scales: [0.8, 1.2]
        aspects: [0.5, 1.0]
        color_jitter:
          brightness: 0.5
          contrast: 0.5
          saturation: 0.5
          hue: 0.1
          p: 0.9
        gray_scale: True
        gau_blur: False
    dataset:
      _target_: training.data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: training.data.datasets.co3d.Co3dDataset
          split: train
          CO3D_DIR: /opt/dlami/nvme/data/co3d
          CO3D_ANNOTATION_DIR: /opt/dlami/nvme/data/co3d_anno
        # - _target_: training.data.datasets.zeroverse.ZeroVerseDataset
        #   split: train
        #   ZEROVERSE_DIR: /opt/dlami/nvme/data/zeroverse/
  val:
    _target_: training.data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: True
    dataset:
      _target_: training.data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: training.data.datasets.co3d.Co3dDataset
          split: test
          CO3D_DIR: /opt/dlami/nvme/data/co3d
          CO3D_ANNOTATION_DIR: /opt/dlami/nvme/data/co3d_anno
        # - _target_: training.data.datasets.zeroverse.ZeroVerseDataset
        #   split: test
        #   ZEROVERSE_DIR: /opt/dlami/nvme/data/zeroverse


logging:
  log_dir: logs
  log_visuals: True
  log_visual_frequency:
    train: 50
    val: 25
  visuals_keys_to_log:
    train:
      keys_to_log:
         - renders
         - original_images
      modality: image
  visuals_per_batch_to_log: 4
  video_logging_fps: 15
  log_freq: 5
  log_level_primary: DEBUG
  log_level_secondary: WARNING
  all_ranks: False
  tensorboard_writer:
    _target_: training.train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard
  scalar_keys_to_log:
    train:
      keys_to_log:
        - objective
        - loss_camera
        - render_loss
        # - loss_T
        # - loss_R
        # - loss_FL
        # - loss_conf_depth
        # - loss_reg_depth
        # - loss_grad_depth
    val:
      keys_to_log:
        - objective
        - loss_camera
        - render_loss
        # - loss_T
        # - loss_R
        # - loss_FL
        # - loss_conf_depth
        # - loss_reg_depth
        # - loss_grad_depth



checkpoint:
  save_dir: logs/${exp_name}/ckpts
  save_freq: 2
  resume_checkpoint_path: /home/ubuntu/xiyang/programs/vggt/ckpts/model.pt
  strict: False


loss:
  _target_: training.loss.MultitaskLoss
  camera: 
    weight: 0.5
    loss_type: "l1" # The paper uses smooth l1 loss, but we found l1 loss is more stable than smooth l1 and l2 loss.  
    enable: False
  depth:
    weight: 1.0
    gradient_loss_fn: "grad" 
    valid_range: 0.98
    enable: False
  point: 
    enable: False
  # If you want to enable point, use the following config
  # point: 
  #   weight: 1.0
  #   gradient_loss_fn: "normal" 
  #   valid_range: 0.98
  track:
    enable: False  
  rendering: 
    weight: 1.0
    w_mse: 1.0 # the weight of mse loss
    w_perceptual: 0.5 # the weight of perceptual loss
    enable: True




optim:
  param_group_modifiers: False

  optimizer:
    _target_: torch.optim.AdamW
    lr: 5e-5
    weight_decay: 0.05

  frozen_module_names:
      # - "*aggregator*"  # example, freeze the aggregator
      - "*point_head*"
      - "*camera_head*"
      - "*depth_head*"

  amp:
    enabled: True
    amp_dtype: bfloat16
  gradient_clip:
    _target_: training.train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["aggregator"]
        max_norm: 0.3   # feel free to reduce this if you see instabilities
        norm_type: 2
      # - module_name: ["point"]
      #   max_norm: 1.0
      #   norm_type: 2
      # - module_name: ["depth"]
      #   max_norm: 1.0   # feel free to reduce this if you see instabilities
      #   norm_type: 2
      # - module_name: ["camera"]
      #   max_norm: 1.0   # feel free to reduce this if you see instabilities
      #   norm_type: 2
      - module_name: ["gs_head"]
        max_norm: 0.5
        norm_type: 2
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: 5e-5        # ↑ warmup 到 peak LR
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 5e-5
              end_value: 1e-6        # ↓ 衰减到较高的 floor，避免过近 0
          lengths: [0.10, 0.90]      # 10% warmup, 90% cosine decay
          interval_scaling: ['rescaled', 'rescaled']
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.01







max_epochs: 20

model:
  _target_: vggt.models.vggt_gs.VGGT_GS
  enable_camera: True
  enable_depth: True
  enable_point: True
  enable_track: False
  debug: False
  use_distributed_render: False # this has bugs, please do not set true as this time 
  sh_degree: 0

distributed:
  # check https://docs.pytorch.org/docs/stable/generated/torch.nn.parallel.DistributedDataParallel.html for options
  backend: nccl
  comms_dtype: None
  find_unused_parameters: False
  timeout_mins: 30
  gradient_as_bucket_view: True  # Less memory used
  bucket_cap_mb: 25
  broadcast_buffers: True

cuda:
    cudnn_deterministic: False
    cudnn_benchmark: False
    allow_tf32: True